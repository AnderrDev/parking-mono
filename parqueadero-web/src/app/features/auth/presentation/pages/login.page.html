<div class="login-wrapper">
      <main class="login-card" aria-labelledby="login-title">
        <header class="login-card__header">
          <span class="login-card__logo" aria-hidden="true">
            <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
              <rect width="32" height="32" rx="8" fill="var(--color-primary)"/>
              <path d="M11 8h6.5a4.5 4.5 0 0 1 0 9H13v7h-2V8z M13 10v5h4.5a2.5 2.5 0 0 0 0-5H13z" fill="white"/>
            </svg>
          </span>
          <h1 id="login-title" class="login-card__title">Bienvenido</h1>
          <p class="login-card__subtitle">Ingresa con tu cuenta para continuar</p>
        </header>

        <form
          class="login-card__form"
          [formGroup]="form"
          (ngSubmit)="onSubmit()"
          novalidate
        >
          <div class="field">
            <label class="field__label" for="email">Correo electrónico</label>
            <input
              id="email"
              class="field__input"
              [class.field__input--error]="showFieldError('email')"
              type="email"
              formControlName="email"
              autocomplete="email"
              inputmode="email"
              readonly
              placeholder="admin@parqueadero.com"
              [attr.aria-describedby]="showFieldError('email') ? 'email-error' : null"
              [attr.aria-invalid]="showFieldError('email') ? 'true' : null"
            />
            @if (showFieldError('email')) {
              <span id="email-error" class="field__error" role="alert">
                {{ getFieldError('email') }}
              </span>
            }
          </div>

          <div class="field">
            <label class="field__label" for="password">Contraseña</label>
            <div class="field__input-wrap">
              <input
                id="password"
                class="field__input"
                [class.field__input--error]="showFieldError('password')"
                [type]="showPassword() ? 'text' : 'password'"
                formControlName="password"
                autocomplete="current-password"
                placeholder="••••••"
                [attr.aria-describedby]="showFieldError('password') ? 'password-error' : null"
                [attr.aria-invalid]="showFieldError('password') ? 'true' : null"
              />
              <button
                type="button"
                class="field__toggle"
                (click)="togglePassword()"
                [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                [attr.aria-pressed]="showPassword()"
                [disabled]="loading()"
              >
                @if (showPassword()) {
                  <!-- Ojo tachado — contraseña visible -->
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                  </svg>
                } @else {
                  <!-- Ojo abierto — contraseña oculta -->
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                }
              </button>
            </div>
            @if (showFieldError('password')) {
              <span id="password-error" class="field__error" role="alert">
                {{ getFieldError('password') }}
              </span>
            }
          </div>

          @if (errorMessage()) {
            <app-error-display
              [message]="errorMessage()!"
              variant="inline"
            />
          }

          <button
            class="login-card__submit"
            type="submit"
            [disabled]="loading()"
          >
            @if (loading()) {
              <app-loading-spinner label="Iniciando sesión..." />
            } @else {
              Ingresar
            }
          </button>
        </form>
      </main>
    </div>
