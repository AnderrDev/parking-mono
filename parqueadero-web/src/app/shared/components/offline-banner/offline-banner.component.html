@if (state() !== 'hidden') {
  <div class="banner" [attr.data-state]="state()" role="status" aria-live="polite">
    <span class="banner__icon" aria-hidden="true">
      @switch (state()) {
        @case ('conflict') {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <circle cx="12" cy="17" r="1"/>
          </svg>
        }
        @case ('syncing') {
          <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
          </svg>
        }
        @default {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 6s4-2 11-2 11 2 11 2"/>
            <path d="M5 10s3-1.5 7-1.5 7 1.5 7 1.5"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
            <circle cx="12" cy="20" r="1"/>
          </svg>
        }
      }
    </span>
    <span class="banner__text">{{ message() }}</span>
    @if (state() === 'online-pending' || state() === 'conflict') {
      <button type="button" class="banner__action" (click)="onBannerActionClick()">
        {{ actionLabel() }}
      </button>
    }
  </div>
}
