<span
  class="spinner"
  [class.spinner--sm]="size() === 'sm'"
  [class.spinner--md]="size() === 'md'"
  [class.spinner--lg]="size() === 'lg'"
  [class.spinner--inverse]="variant() === 'inverse'"
  [class.spinner--accent]="variant() === 'accent'"
  role="status"
  aria-live="polite"
  [attr.aria-label]="label()"
>
  <svg
    class="spinner__svg"
    viewBox="0 0 24 24"
    fill="none"
    aria-hidden="true"
  >
    <circle
      class="spinner__track"
      cx="12" cy="12" r="10"
      stroke-width="2.5"
    />
    <path
      class="spinner__arc"
      d="M12 2a10 10 0 0 1 10 10"
      stroke-width="2.5"
      stroke-linecap="round"
    />
  </svg>
  @if (showLabel()) {
    <span class="spinner__label">{{ label() }}</span>
  } @else {
    <span class="sr-only">{{ label() }}</span>
  }
</span>
